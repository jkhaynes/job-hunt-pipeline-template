name: daily-job-digest
on:
  schedule:
    - cron: "0 10 * * *"      # 6am EDT, 5am EST (cron runs in UTC)
  workflow_dispatch:          # manual "Run workflow" button
    inputs:
      profile:
        description: "Profile: blank for config/criteria.yaml, or NAME for config/NAME.yaml"
        required: false
        default: ""

# One run at a time, so two profiles never race to commit data/.
concurrency:
  group: job-digest
  cancel-in-progress: false

permissions:
  contents: write             # to commit seen.json

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Self-test
        run: dotnet run --project src/JobHunt -- --self-test

      - name: Run pipeline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          PROFILE: ${{ inputs.profile }}
        run: dotnet run --project src/JobHunt -- --out out/ ${PROFILE:+--profile "$PROFILE"}

      - name: Save digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: out/*.html
          retention-days: 30

      - name: Commit seen jobs and learned boards
        run: |
          git config user.name "job-hunt-bot"
          git config user.email "job-hunt-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || { git commit -m "Update seen jobs, job boards, and queue" && git push; }
